# CI：类型检查 + 单元测试 + E2E + 三端构建
#
# 依赖更新：Dependabot 按周/月提 PR（见 dependabot.yml），但**不自动合并**。
# 涉及资金的依赖变更一律人工 review + 过 CI 后才合并。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 权限最小化
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # P0-10：PG16 service 容器用于 migrate deploy 冒烟（空库回放全部迁移，
    # 提前发现 schema↔migration 漂移）；单测本身不依赖数据库
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # 所有步骤共享的环境变量（Prisma 7 的 prisma.config.js 用 env() 强校验，generate 阶段也需要 DATABASE_URL）
    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test?schema=public"
      REDIS_URL: "redis://localhost:6379"
      JWT_USER_SECRET: ${{ secrets.CI_JWT_USER_SECRET || 'ci-test-secret-user-32chars-padding' }}
      JWT_ADMIN_SECRET: ${{ secrets.CI_JWT_ADMIN_SECRET || 'ci-test-secret-admin-32chars-padding' }}
      JWT_AGENT_SECRET: ${{ secrets.CI_JWT_AGENT_SECRET || 'ci-test-secret-agent-32chars-padding' }}
      ADMIN_DEFAULT_PASSWORD: ${{ secrets.CI_ADMIN_DEFAULT_PASSWORD || 'CiTest2026' }}
      ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY || 'ci-test-encryption-key-32-chars-ok' }}
      MOCK_CHANNEL_SECRET: ${{ secrets.CI_MOCK_CHANNEL_SECRET || 'ci-test-mock-secret' }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Version consistency check
        run: npm run version:check

      - name: Migration smoke (empty-database migrate deploy)
        run: npx prisma migrate deploy

      - name: Type check
        run: npx tsc --noEmit

      # P0-20：正确性 job 走快速路径——不带 coverage（覆盖率生成/统计是全链路
      # 最贵的一步，且 coverageThreshold 门禁会掩盖真正测试失败）。
      # 正确性与门禁解耦：门禁挪到下方独立 coverage job（慢路径，不阻塞快速反馈）。
      - name: Run unit tests
        run: npm test

  # P0-20：独立 coverage 门禁 job。只在正确性全绿后才跑（needs: test），
  # 慢但专职；coverageThreshold 退坡/抬升不再拖慢正确性反馈。
  coverage:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test?schema=public"
      REDIS_URL: "redis://localhost:6379"
      JWT_USER_SECRET: ${{ secrets.CI_JWT_USER_SECRET || 'ci-test-secret-user-32chars-padding' }}
      JWT_ADMIN_SECRET: ${{ secrets.CI_JWT_ADMIN_SECRET || 'ci-test-secret-admin-32chars-padding' }}
      JWT_AGENT_SECRET: ${{ secrets.CI_JWT_AGENT_SECRET || 'ci-test-secret-agent-32chars-padding' }}
      ADMIN_DEFAULT_PASSWORD: ${{ secrets.CI_ADMIN_DEFAULT_PASSWORD || 'CiTest2026' }}
      ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY || 'ci-test-encryption-key-32-chars-ok' }}
      MOCK_CHANNEL_SECRET: ${{ secrets.CI_MOCK_CHANNEL_SECRET || 'ci-test-mock-secret' }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Coverage gate (threshold enforce)
        run: npm run test:cov

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    # E2E 套件内部使用内存 Mock Prisma/Redis，不需要真实服务容器；
    # 但模块初始化会实例化 CryptoService 等，需要满足 env-validation 的最小 env
    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test?schema=public"
      REDIS_URL: "redis://localhost:6379"
      JWT_USER_SECRET: ${{ secrets.CI_JWT_USER_SECRET || 'ci-test-secret-user-32chars-padding' }}
      JWT_ADMIN_SECRET: ${{ secrets.CI_JWT_ADMIN_SECRET || 'ci-test-secret-admin-32chars-padding' }}
      JWT_AGENT_SECRET: ${{ secrets.CI_JWT_AGENT_SECRET || 'ci-test-secret-agent-32chars-padding' }}
      ADMIN_DEFAULT_PASSWORD: ${{ secrets.CI_ADMIN_DEFAULT_PASSWORD || 'CiTest2026' }}
      ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY || 'ci-test-encryption-key-32-chars-ok' }}
      MOCK_CHANNEL_SECRET: ${{ secrets.CI_MOCK_CHANNEL_SECRET || 'ci-test-mock-secret' }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run E2E tests
        run: npm run test:e2e -- --passWithNoTests

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web (Vue merchant portal)
        working-directory: web
        run: npm run build

  web-h5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web-h5/package-lock.json'

      - name: Install web-h5 dependencies
        working-directory: web-h5
        run: npm ci

      - name: Build web-h5 (Vue user H5)
        working-directory: web-h5
        run: npm run build

  web-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web-admin/package-lock.json'

      - name: Install web-admin dependencies
        working-directory: web-admin
        run: npm ci

      - name: Build web-admin (Vue admin panel)
        working-directory: web-admin
        run: npm run build
