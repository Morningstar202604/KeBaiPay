# 最小 CI 配置 — 仅运行类型检查和单元测试
# 不启用：Dependabot / Renovate / 自动合并 / 机器人 / 自动依赖升级
# 人工管理所有依赖更新和合并

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 权限最小化
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # P0-10：PG16 service 容器用于 migrate deploy 冒烟（空库回放全部迁移，
    # 提前发现 schema↔migration 漂移）；单测本身不依赖数据库
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # 所有步骤共享的环境变量（Prisma 7 的 prisma.config.js 用 env() 强校验，generate 阶段也需要 DATABASE_URL）
    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test?schema=public"
      REDIS_URL: "redis://localhost:6379"
      JWT_USER_SECRET: ${{ secrets.CI_JWT_USER_SECRET || 'ci-test-secret-user-32chars-padding' }}
      JWT_ADMIN_SECRET: ${{ secrets.CI_JWT_ADMIN_SECRET || 'ci-test-secret-admin-32chars-padding' }}
      JWT_AGENT_SECRET: ${{ secrets.CI_JWT_AGENT_SECRET || 'ci-test-secret-agent-32chars-padding' }}
      ADMIN_DEFAULT_PASSWORD: ${{ secrets.CI_ADMIN_DEFAULT_PASSWORD || 'CiTest2026' }}
      ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY || 'ci-test-encryption-key-32-chars-ok' }}
      MOCK_CHANNEL_SECRET: ${{ secrets.CI_MOCK_CHANNEL_SECRET || 'ci-test-mock-secret' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Version consistency check
        run: npm run version:check

      - name: Migration smoke (empty-database migrate deploy)
        run: npx prisma migrate deploy

      - name: Type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test -- --passWithNoTests

  e2e:
    runs-on: ubuntu-latest
    # E2E 套件内部使用内存 Mock Prisma/Redis，不需要真实服务容器；
    # 但模块初始化会实例化 CryptoService 等，需要满足 env-validation 的最小 env
    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test?schema=public"
      REDIS_URL: "redis://localhost:6379"
      JWT_USER_SECRET: ${{ secrets.CI_JWT_USER_SECRET || 'ci-test-secret-user-32chars-padding' }}
      JWT_ADMIN_SECRET: ${{ secrets.CI_JWT_ADMIN_SECRET || 'ci-test-secret-admin-32chars-padding' }}
      JWT_AGENT_SECRET: ${{ secrets.CI_JWT_AGENT_SECRET || 'ci-test-secret-agent-32chars-padding' }}
      ADMIN_DEFAULT_PASSWORD: ${{ secrets.CI_ADMIN_DEFAULT_PASSWORD || 'CiTest2026' }}
      ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY || 'ci-test-encryption-key-32-chars-ok' }}
      MOCK_CHANNEL_SECRET: ${{ secrets.CI_MOCK_CHANNEL_SECRET || 'ci-test-mock-secret' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run E2E tests
        run: npm run test:e2e -- --passWithNoTests

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web (Vue merchant portal)
        working-directory: web
        run: npm run build

  web-h5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web-h5/package-lock.json'

      - name: Install web-h5 dependencies
        working-directory: web-h5
        run: npm ci

      - name: Build web-h5 (Vue user H5)
        working-directory: web-h5
        run: npm run build

  web-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web-admin/package-lock.json'

      - name: Install web-admin dependencies
        working-directory: web-admin
        run: npm ci

      - name: Build web-admin (Vue admin panel)
        working-directory: web-admin
        run: npm run build
