name: 💡 功能建议
description: 提出新功能或改进建议
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 先讲场景与痛点，而不是直接给方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: 涉及面（可多选）
      options:
        - label: 后端能力
        - label: 前端体验
        - label: 文档 / DX
        - label: 部署运维
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 参考实现
