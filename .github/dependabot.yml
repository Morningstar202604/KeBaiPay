version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        update-types:
        - patch
        - minor
        - major
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm-group:
        update-types:
        - patch
        - minor
        - major
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm-group:
        update-types:
        - patch
        - minor
        - major
  - package-ecosystem: npm
    directory: /web-admin
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm-group:
        update-types:
        - patch
        - minor
        - major
  - package-ecosystem: npm
    directory: /web-h5
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm-group:
        update-types:
        - patch
        - minor
        - major
