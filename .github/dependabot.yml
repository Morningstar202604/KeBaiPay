version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        update-types:
        - patch
        - minor
        - major
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm-minor:
        update-types:
        - patch
        - minor
    ignore:
    # 跨大版本升级需人工审查，不让 dependabot 自动出 PR
    - dep: "typescript"
      update-ecosystem: npm
    - dep: "typescript"
      update-type: major
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm-minor:
        update-types:
        - patch
        - minor
    ignore:
    - dep: "typescript"
      update-type: major
  - package-ecosystem: npm
    directory: /web-admin
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm-minor:
        update-types:
        - patch
        - minor
    ignore:
    - dep: "typescript"
      update-type: major
  - package-ecosystem: npm
    directory: /web-h5
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm-minor:
        update-types:
        - patch
        - minor
    ignore:
    - dep: "typescript"
      update-type: major
